<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEREBRO_OS - Inteligencia Personal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-color: #F9F7F2;      /* Crema Claude */
            --card-bg: #FFFFFF;
            --text-main: #2D2D2D;     /* Carbón */
            --text-muted: #6B6B6B;
            --accent: #6B5B95;        /* Púrpura Sofisticado (No naranja) */
            --border-color: #E5E1DA;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        /* --- Header Editorial --- */
        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .logo-icon {
            font-size: 2.5rem;
            color: var(--accent);
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* --- Sección de Autenticación --- */
        .auth-section {
            text-align: center;
            padding: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow);
            max-width: 500px;
            margin: 0 auto;
        }

        .auth-button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .auth-button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(107, 91, 149, 0.3);
        }

        /* --- Dashboard --- */
        .dashboard { display: none; }
        .dashboard.active { display: block; }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
        }

        .user-details h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
        }

        .user-details p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #FEE2E2;
            color: #EF4444;
            border-color: #EF4444;
        }

        /* --- Grilla de Eventos --- */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .event-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .event-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--accent);
            border-radius: 12px 12px 0 0;
            opacity: 0.3;
        }

        .event-time {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .event-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--text-main);
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .event-description {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .event-location {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .event-location i { color: var(--accent); }

        /* --- Estados --- */
        .loading { text-align: center; padding: 100px; color: var(--text-muted); }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .logo-text { font-size: 2.2rem; }
            .dashboard-header { flex-direction: column; align-items: flex-start; gap: 20px; }
            .logout-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="logo-container">
                <i class="fas fa-brain logo-icon"></i>
                <h1 class="logo-text">CEREBRO_OS</h1>
            </div>
            <p class="subtitle">CENTRO DE INTELIGENCIA PERSONAL</p>
        </header>

        <main class="auth-section" id="authSection">
            <p style="color: var(--text-muted); margin-bottom: 10px;">Tu órbita de datos está lista para sincronizarse.</p>
            <button class="auth-button" onclick="startAuthFlow()">
                <i class="fab fa-google"></i> Sincronizar con Google
            </button>
        </main>

        <section class="dashboard" id="dashboard">
            <header class="dashboard-header">
                <div class="user-info">
                    <img id="userAvatar" class="user-avatar" src="" alt="Avatar" referrerpolicy="no-referrer">
                    <div class="user-details">
                        <h3 id="userName">Cargando...</h3>
                        <p id="userEmail"></p>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </header>

            <div id="eventsContainer" class="events-grid">
                </div>
        </section>
    </div>

    <script>
        // Tu ID de Cliente (Mantenlo tal cual)
        const CLIENT_ID = '351239629977-h5fknbnjlssat4dko521nh1srtblki07.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email';

        let tokenClient;
        let accessToken = null;
        let userProfile = null;

        function initializeGoogleAuth() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        accessToken = tokenResponse.access_token;
                        showLoading();
                        loadUserProfile()
                            .then(() => loadRealCalendarEvents())
                            .catch(err => loadRealCalendarEvents());
                    }
                },
            });
        }

        function loadUserProfile() {
            return fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { 'Authorization': `Bearer ${accessToken}` }
            })
            .then(res => res.json())
            .then(data => {
                userProfile = data;
                displayUser();
            });
        }

        function loadRealCalendarEvents() {
            const now = new Date().toISOString();
            const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${now}&maxResults=12&orderBy=startTime&singleEvents=true`;

            fetch(url, { headers: { 'Authorization': `Bearer ${accessToken}` } })
                .then(res => res.json())
                .then(data => {
                    displayEvents(data.items || []);
                })
                .catch(err => {
                    console.error(err);
                    showError("No se pudieron cargar los datos del calendario.");
                });
        }

        function displayEvents(events) {
            const container = document.getElementById('eventsContainer');
            container.innerHTML = '';

            if (events.length === 0) {
                container.innerHTML = `<p style="text-align: center; grid-column: 1/-1; padding: 50px;">No hay eventos en tu calendario.</p>`;
                return;
            }

            events.forEach(event => {
                const start = event.start.dateTime || event.start.date;
                const eventDate = new Date(start);
                const card = document.createElement('div');
                card.className = 'event-card';
                
                card.innerHTML = `
                    <div class="event-time">
                        <i class="far fa-clock"></i> ${formatEventTime(eventDate)}
                    </div>
                    <h3 class="event-title">${escapeHtml(event.summary || 'Sin título')}</h3>
                    ${event.description ? `<p class="event-description">${escapeHtml(event.description)}</p>` : ''}
                    ${event.location ? `<div class="event-location"><i class="fas fa-location-dot"></i> ${escapeHtml(event.location)}</div>` : ''}
                `;
                container.appendChild(card);
            });

            document.getElementById('dashboard').classList.add('active');
            document.getElementById('authSection').style.display = 'none';
        }

        function formatEventTime(date) {
            const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const day = days[date.getDay()];
            const hour = date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            return `${day}, ${date.getDate()} de ${date.toLocaleDateString('es-ES', { month: 'short' })} · ${hour}`;
        }

        function displayUser() {
            if (userProfile) {
                document.getElementById('userName').textContent = userProfile.name;
                document.getElementById('userEmail').textContent = userProfile.email;
                document.getElementById('userAvatar').src = userProfile.picture;
            }
        }

        function showLoading() {
            document.getElementById('eventsContainer').innerHTML = `<div class="loading"><div class="spinner"></div><p>Sincronizando...</p></div>`;
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('authSection').style.display = 'none';
        }

        function logout() {
            accessToken = null;
            location.reload();
        }

        function startAuthFlow() {
            if (tokenClient) tokenClient.requestAccessToken({prompt: 'select_account'});
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.addEventListener('load', initializeGoogleAuth);
    </script>
</body>
</html>
