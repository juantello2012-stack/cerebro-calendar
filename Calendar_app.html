<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEREBRO_OS - Calendar Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier Prime', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0f0f1e 100%);
            background-attachment: fixed;
            color: #e0e6ed;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            color: #fff;
            text-shadow: 0 0 10px #b388ff, 0 0 20px #8c9eff, 0 0 40px #6366f1;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #8c9eff;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .auth-section {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.6s ease-out 0.2s backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #buttonDiv {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
            min-height: 40px; /* Asegura espacio para el botón de Google */
        }

        .auth-button {
            background: rgba(179, 136, 255, 0.15);
            border: 2px solid #b388ff;
            color: #b388ff;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Courier Prime', monospace;
            font-weight: 700;
            transition: all 0.3s ease;
            font-size: 1rem;
            display: inline-block;
        }

        .auth-button:hover {
            background: rgba(179, 136, 255, 0.3);
            box-shadow: 0 0 20px rgba(179, 136, 255, 0.5);
            transform: translateY(-2px);
        }

        .dashboard { display: none; animation: fadeIn 0.8s ease-out; }
        .dashboard.active { display: block; }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(15, 15, 25, 0.5);
            backdrop-filter: blur(12px);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(179, 136, 255, 0.2);
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #b388ff;
        }

        .user-details h3 { color: #fff; font-size: 0.95rem; margin-bottom: 3px; }
        .user-details p { color: #8c9eff; font-size: 0.85rem; }

        .logout-btn {
            background: rgba(255, 100, 100, 0.15);
            border: 1px solid rgba(255, 100, 100, 0.4);
            color: #ff6464;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier Prime', monospace;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .logout-btn:hover {
            background: rgba(255, 100, 100, 0.3);
            box-shadow: 0 0 15px rgba(255, 100, 100, 0.3);
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .glass-card {
            background: rgba(15, 15, 25, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            animation: cardSlideIn 0.6s ease-out backwards;
        }

        @keyframes cardSlideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card:hover {
            transform: translateY(-8px);
            border-color: rgba(179, 136, 255, 0.5);
            box-shadow: 0 10px 40px rgba(138, 43, 226, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .event-time {
            color: #8c9eff;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time-icon {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #8c9eff;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .event-title { color: #fff; font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }
        .event-description { color: #a8aebe; font-size: 0.9rem; margin-bottom: 15px; line-height: 1.5; }
        .event-location { color: #b388ff; font-size: 0.85rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        
        .event-meta {
            display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px;
            padding-top: 15px; border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .badge {
            background: rgba(179, 136, 255, 0.1);
            border: 1px solid rgba(179, 136, 255, 0.2);
            color: #b388ff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .empty-state { text-align: center; padding: 80px 20px; animation: fadeIn 0.8s ease-out; }
        .empty-icon { font-size: 4rem; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        .empty-state h2 { color: #fff; font-size: 1.8rem; margin-bottom: 10px; }
        .empty-state p { color: #8c9eff; font-size: 1rem; }

        .loading { text-align: center; padding: 60px 20px; }
        .spinner {
            display: inline-block; width: 40px; height: 40px;
            border: 3px solid rgba(179, 136, 255, 0.2);
            border-top-color: #b388ff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #8c9eff; margin-top: 20px; font-size: 0.95rem; }

        .error-message, .local-warning {
            background: rgba(255, 165, 0, 0.15);
            border: 1px solid #ffa500;
            color: #ffa500;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 0.9rem;
            line-height: 1.5;
            display: inline-block;
            max-width: 600px;
        }

    </style>
</head>
<body>
    <div class="stars" id="starfield"></div>

    <div class="container">
        <div class="header">
            <div class="logo">🌌 CEREBRO_OS</div>
            <div class="subtitle">Calendar Hub</div>
        </div>

        <div class="auth-section" id="authSection">
            <p style="margin-bottom: 20px; color: #8c9eff; font-size: 0.95rem;">Inicia sesión con Google para sincronizar tu órbita</p>
            
            <div id="localSetupWarning" style="display: none;"></div>
            
            <div id="buttonDiv"></div>
            
            <button class="auth-button" onclick="manualAuth()">🔐 Autorizar Acceso al Calendario</button>
        </div>

        <div class="dashboard" id="dashboard">
            <div class="dashboard-header">
                <div class="user-info">
                    <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
                    <div class="user-details">
                        <h3 id="userName">Usuario</h3>
                        <p id="userEmail">email@example.com</p>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">🚪 Cerrar sesión</button>
            </div>

            <div id="eventsContainer" class="events-grid"></div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '351239629977-h5fknbnjlssat4dko521nh1srtblki07.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/calendar.readonly';

        let tokenClient;
        let accessToken = null;
        let userProfile = null;

        function createStarfield() {
            const starfield = document.getElementById('starfield');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starfield.appendChild(star);
            }
        }

        function initializeGoogleAuth() {
            // Verificación de archivo local
            if (window.location.protocol === 'file:') {
                const warningDiv = document.getElementById('localSetupWarning');
                warningDiv.style.display = 'block';
                warningDiv.innerHTML = `
                    <strong>⚠️ Bloqueo de Seguridad de Google:</strong><br>
                    Estás abriendo el archivo localmente (file://). Google oculta el botón de inicio de sesión por este medio.<br><br>
                    <strong>Solución rápida:</strong><br>
                    1. Abre una terminal en esta carpeta.<br>
                    2. Ejecuta: <code>python -m http.server 8000</code><br>
                    3. Entra desde tu navegador a: <code>http://localhost:8000/Calendar_app.html</code>
                `;
                return; // Detenemos la inicialización si es file:// para evitar errores en consola
            }

            google.accounts.id.initialize({
                client_id: CLIENT_ID,
                callback: handleCredentialResponse,
                auto_select: false,
            });

            google.accounts.id.renderButton(
                document.getElementById('buttonDiv'),
                { theme: 'outline', size: 'large', locale: 'es' }
            );

            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        accessToken = tokenResponse.access_token;
                        loadRealCalendarEvents();
                    }
                },
            });
        }

        function handleCredentialResponse(response) {
            const token = response.credential;
            decodeAndUseToken(token);
        }

        function decodeAndUseToken(token) {
            try {
                const parts = token.split('.');
                const payload = JSON.parse(atob(parts[1]));
                
                userProfile = {
                    email: payload.email,
                    name: payload.name,
                    picture: payload.picture
                };

                displayUser();
                
                if (tokenClient) {
                    tokenClient.requestAccessToken({prompt: ''});
                }
            } catch (error) {
                console.error('Error decodificando token:', error);
                showError('Error al procesar autenticación base');
            }
        }

        function loadRealCalendarEvents() {
            if (!accessToken) {
                showError('Error: No se pudo obtener acceso al calendario');
                return;
            }

            showLoading();
            const now = new Date().toISOString();
            const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${now}&maxResults=12&orderBy=startTime&singleEvents=true`;

            fetch(url, { headers: { 'Authorization': `Bearer ${accessToken}` } })
                .then(response => {
                    if (!response.ok) throw new Error('Permisos insuficientes o error de API');
                    return response.json();
                })
                .then(data => {
                    if (data.items && data.items.length > 0) {
                        displayEvents(data.items);
                    } else {
                        showEmptyState();
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showError('No se pudieron recuperar eventos reales. Verifica las restricciones de Orígenes de JavaScript en Google Cloud.');
                });
        }

        function displayEvents(events) {
            const container = document.getElementById('eventsContainer');
            container.innerHTML = '';

            events.forEach(event => {
                const start = event.start.dateTime || event.start.date;
                const eventDate = new Date(start);
                const now = new Date();
                const isToday = eventDate.toDateString() === now.toDateString();
                const isSoon = eventDate < new Date(now.getTime() + 3600000);

                const card = document.createElement('div');
                card.className = 'glass-card';
                
                const timeString = formatEventTime(eventDate);
                const badge = isToday ? 'HOY' : isSoon ? 'PRONTO' : 'PRÓXIMO';

                card.innerHTML = `
                    <div class="event-time"><span class="time-icon"></span>${timeString}</div>
                    <h3 class="event-title">${escapeHtml(event.summary || 'Sin título')}</h3>
                    ${event.description ? `<p class="event-description">${escapeHtml(event.description)}</p>` : ''}
                    ${event.location ? `<div class="event-location">📍 ${escapeHtml(event.location)}</div>` : ''}
                    <div class="event-meta"><span class="badge">${badge}</span></div>
                `;
                container.appendChild(card);
            });

            document.getElementById('dashboard').classList.add('active');
            document.getElementById('authSection').style.display = 'none';
        }

        function formatEventTime(date) {
            const now = new Date();
            const timeDiff = date - now;
            const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            
            let dateStr = '';
            if (date.toDateString() === now.toDateString()) {
                dateStr = 'Hoy';
            } else if (days === 1) {
                dateStr = 'Mañana';
            } else if (days > 1 && days < 7) {
                dateStr = `En ${days} días`;
            } else {
                dateStr = date.toLocaleDateString('es-ES', { month: 'short', day: 'numeric' });
            }

            const timeStr = date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            return `${dateStr} · ${timeStr}`;
        }

        function displayUser() {
            if (userProfile) {
                document.getElementById('userName').textContent = userProfile.name;
                document.getElementById('userEmail').textContent = userProfile.email;
                document.getElementById('userAvatar').src = userProfile.picture;
            }
        }

        function showEmptyState() {
            document.getElementById('eventsContainer').innerHTML = `
                <div style="grid-column: 1/-1;">
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <h2>No hay eventos próximos</h2>
                        <p>Tu calendario está libre de anomalías espaciales. ¡Relájate! 🌙</p>
                    </div>
                </div>
            `;
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('authSection').style.display = 'none';
        }

        function showLoading() {
            document.getElementById('eventsContainer').innerHTML = `
                <div style="grid-column: 1/-1;"><div class="loading"><div class="spinner"></div><div class="loading-text">Sincronizando coordenadas temporales...</div></div></div>
            `;
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('authSection').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('eventsContainer').innerHTML = `<div style="grid-column: 1/-1;"><div class="error-message">${message}</div></div>`;
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('authSection').style.display = 'none';
        }

        function logout() {
            google.accounts.id.disableAutoSelect();
            accessToken = null;
            userProfile = null;
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('eventsContainer').innerHTML = '';
        }

        function manualAuth() {
            if (window.location.protocol === 'file:') {
                alert('No se puede conectar usando file://. Inicia un servidor local.');
                return;
            }
            if (tokenClient) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            } else {
                alert('El componente de autenticación aún está inicializándose.');
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        window.addEventListener('load', () => {
            createStarfield();
            try {
                initializeGoogleAuth();
            } catch (error) {
                console.error('Error al inicializar la autenticación:', error);
            }
        });
    </script>
</body>
</html>
