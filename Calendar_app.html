<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Brain - Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier Prime', monospace;
            background-color: #f7f6f3;
            color: #2c2c2c;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animación de fondo starfield */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            color: #2c2c2c;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9b9995;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .auth-section {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.6s ease-out 0.2s backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #g_id_onload {
            display: inline-block;
            margin-bottom: 15px;
        }

        .auth-button {
            background: rgba(179, 136, 255, 0.15);
            border: 2px solid #b388ff;
            color: #b388ff;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Courier Prime', monospace;
            font-weight: 700;
            transition: all 0.3s ease;
            margin-top: 20px;
            font-size: 1rem;
            display: inline-block;
        }

        .auth-button:hover {
            background: rgba(179, 136, 255, 0.3);
            box-shadow: 0 0 20px rgba(179, 136, 255, 0.5);
            transform: translateY(-2px);
        }

        .dashboard {
            display: none;
            animation: fadeIn 0.8s ease-out;
        }

        .dashboard.active {
            display: block;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #ffffff;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #e5e3df;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #d4d1ca;
        }

        .user-details h3 {
            color: #2c2c2c;
            font-size: 0.95rem;
            margin-bottom: 3px;
        }

        .user-details p {
            color: #9b9995;
            font-size: 0.85rem;
        }

        .logout-btn {
            background: rgba(255, 100, 100, 0.15);
            border: 1px solid rgba(255, 100, 100, 0.4);
            color: #ff6464;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier Prime', monospace;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .logout-btn:hover {
            background: rgba(255, 100, 100, 0.3);
            box-shadow: 0 0 15px rgba(255, 100, 100, 0.3);
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .glass-card {
            background: #ffffff;
            border: 1px solid #e5e3df;
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            animation: cardSlideIn 0.6s ease-out backwards;
        }

        @keyframes cardSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(179, 136, 255, 0.3) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .glass-card:hover {
            transform: translateY(-8px);
            border-color: #d4d1ca;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .glass-card:hover::before {
            opacity: 1;
        }

        .event-time {
            color: #9b9995;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time-icon {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #8c9eff;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .event-title {
            color: #2c2c2c;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .event-description {
            color: #6b6b6b;
            font-size: 0.9rem;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .event-location {
            color: #9b9995;
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .event-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .badge {
            background: rgba(179, 136, 255, 0.1);
            border: 1px solid rgba(179, 136, 255, 0.2);
            color: #b388ff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            animation: fadeIn 0.8s ease-out;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .empty-state h2 {
            color: #2c2c2c;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #9b9995;
            font-size: 1rem;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid #e5e3df;
            border-top-color: #2c2c2c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #9b9995;
            margin-top: 20px;
            font-size: 0.95rem;
        }

        .error-message {
            background: rgba(255, 100, 100, 0.1);
            border: 1px solid rgba(255, 100, 100, 0.3);
            color: #ff6464;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }

            .events-grid {
                grid-template-columns: 1fr;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .user-info {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="starfield"></div>

    <div class="container">
        <div class="header">
            <div class="logo">Second Brain</div>
            <div class="subtitle">Calendar Hub</div>
        </div>

        <div class="auth-section" id="authSection">
            <p style="margin-bottom: 20px; color: #9b9995; font-size: 0.95rem;">Organiza tu segundo cerebro digital sincronizando tu calendario</p>
            <div id="g_id_onload"
                 data-client_id="351239629977-h5fknbnjlssat4dko521nh1srtblki07.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse">
            </div>
            <div id="buttonDiv"></div>
            <br>
            <button class="auth-button" onclick="manualAuth()">🔐 Autorizar Acceso al Calendario</button>
        </div>

        <div class="dashboard" id="dashboard">
            <div class="dashboard-header">
                <div class="user-info">
                    <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
                    <div class="user-details">
                        <h3 id="userName">Usuario</h3>
                        <p id="userEmail">email@example.com</p>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">🚪 Cerrar sesión</button>
            </div>

            <div id="eventsContainer" class="events-grid"></div>
        </div>
    </div>

    <script>
        // ====== CONFIGURACIÓN DE GOOGLE API REAL DE TU CUENTA ======
        const CLIENT_ID = '351239629977-h5fknbnjlssat4dko521nh1srtblki07.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/calendar.readonly';

        let tokenClient;
        let accessToken = null;
        let userProfile = null;

        // ====== GENERAR STARFIELD ======
        function createStarfield() {
            const starfield = document.getElementById('starfield');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starfield.appendChild(star);
            }
        }

        // ====== INICIALIZACIÓN DE GOOGLE IDENTITY SERVICES ======
        function initializeGoogleAuth() {
            // 1. Inicializar autenticación de identidad básica (Perfil y Correo)
            google.accounts.id.initialize({
                client_id: CLIENT_ID,
                callback: handleCredentialResponse,
                auto_select: false,
            });

            google.accounts.id.renderButton(
                document.getElementById('buttonDiv'),
                {
                    theme: 'outline',
                    size: 'large',
                    locale: 'es'
                }
            );

            // 2. Inicializar cliente OAuth2 específico para conseguir el Access Token del Calendario
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        accessToken = tokenResponse.access_token;
                        loadRealCalendarEvents(); // Ejecuta la consulta real al calendario
                    }
                },
            });
        }

        // ====== MANEJAR RESPUESTA DE IDENTIDAD ======
        function handleCredentialResponse(response) {
            const token = response.credential;
            decodeAndUseToken(token);
        }

        // ====== DECODIFICAR JWT ======
        function decodeAndUseToken(token) {
            try {
                const parts = token.split('.');
                const payload = JSON.parse(atob(parts[1]));
                
                userProfile = {
                    email: payload.email,
                    name: payload.name,
                    picture: payload.picture
                };

                displayUser();
                
                // Intentar solicitar el token del calendario de manera fluida tras el login
                tokenClient.requestAccessToken({prompt: ''});
            } catch (error) {
                console.error('Error decodificando token:', error);
                showError('Error al procesar autenticación base');
            }
        }

        // ====== CARGAR EVENTOS REALES DESDE GOOGLE CALENDAR ======
        function loadRealCalendarEvents() {
            if (!accessToken) {
                showError('Error: No se pudo obtener acceso al calendario');
                return;
            }

            showLoading();

            const now = new Date().toISOString();
            // Solicitud directa pasándole el token en las cabeceras HTTP estándares
            const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${now}&maxResults=12&orderBy=startTime&singleEvents=true`;

            fetch(url, {
                headers: {
                    'Authorization': `Bearer ${accessToken}`
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Permisos insuficientes o error de API');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.items && data.items.length > 0) {
                        displayEvents(data.items);
                    } else {
                        showEmptyState();
                    }
                })
                .catch(error => {
                    console.error('Error cargando eventos:', error);
                    showError('No se pudieron recuperar eventos reales. Verifica las restricciones de Orígenes de JavaScript en tu Consola de Google Cloud.');
                });
        }

        // ====== MOSTRAR EVENTOS ======
        function displayEvents(events) {
            const container = document.getElementById('eventsContainer');
            container.innerHTML = '';

            events.forEach(event => {
                const start = event.start.dateTime || event.start.date;
                const eventDate = new Date(start);
                const
